[package]
name = "dropsquash-encoder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
dropsquash-core.workspace = true
dropsquash-media.workspace = true
dropsquash-profiles.workspace = true
serde.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetExportSession", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVMetadataItem", "AVVideoSettings", "block2", "objc2-core-media"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime", "CMSampleBuffer", "CMFormatDescription", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSURL", "NSValue"] }
tempfile.workspace = true
