[workspace]
resolver = "2"
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/dropsquash-core",
  "crates/dropsquash-fileguard",
  "crates/dropsquash-media",
  "crates/dropsquash-profiles",
  "crates/dropsquash-encoder",
  "crates/dropsquash-queue",
  "crates/dropsquash-postprocess",
  "crates/dropsquash-history",
  "crates/dropsquash-license",
  "crates/dropsquash-platform",
  "crates/dropsquash-privacy",
  "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/mt4110/dropsquash"
rust-version = "1.80"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dropsquash-core = { path = "crates/dropsquash-core" }
dropsquash-encoder = { path = "crates/dropsquash-encoder" }
dropsquash-fileguard = { path = "crates/dropsquash-fileguard" }
dropsquash-history = { path = "crates/dropsquash-history" }
dropsquash-license = { path = "crates/dropsquash-license" }
dropsquash-media = { path = "crates/dropsquash-media" }
dropsquash-platform = { path = "crates/dropsquash-platform" }
dropsquash-postprocess = { path = "crates/dropsquash-postprocess" }
dropsquash-privacy = { path = "crates/dropsquash-privacy" }
dropsquash-profiles = { path = "crates/dropsquash-profiles" }
dropsquash-queue = { path = "crates/dropsquash-queue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
