[package]
name = "dropsquash-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dropsquash-core.workspace = true
dropsquash-encoder.workspace = true
dropsquash-fileguard.workspace = true
dropsquash-history.workspace = true
dropsquash-license.workspace = true
dropsquash-platform.workspace = true
dropsquash-postprocess.workspace = true
dropsquash-privacy.workspace = true
dropsquash-queue.workspace = true
libc = "0.2"
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.2"
tokio-util.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio.workspace = true
