name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release-readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Block unsigned Phase 0 release
        shell: bash
        run: |
          echo "Signed release packaging is not implemented."
          exit 1
