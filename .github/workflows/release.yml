name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Rust format check
        run: cargo fmt --all -- --check
      - name: Rust clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: File size architecture check
        run: cargo run -p xtask -- file-size-check
      - name: Static website check
        run: cargo run -p xtask -- website-check
      - name: Manual QA evidence check
        run: cargo run -p xtask -- manual-qa-check
      - name: Release readiness checks
        run: cargo run -p xtask -- release-check
      - uses: pnpm/action-setup@v4
        if: matrix.os == 'macos-latest'
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        if: matrix.os == 'macos-latest'
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            apps/desktop/web/pnpm-lock.yaml
      - name: Install desktop package
        if: matrix.os == 'macos-latest'
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Install desktop web package
        if: matrix.os == 'macos-latest'
        run: pnpm --dir apps/desktop/web install --frozen-lockfile
      - name: Build unsigned macOS DMG
        if: matrix.os == 'macos-latest'
        run: pnpm --dir apps/desktop tauri build --bundles app,dmg --no-sign --ci
      - name: Normalize unsigned DMG name
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- normalize-dmg target/release/bundle/dmg
      - name: Check unsigned DMG artifact
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- artifact-check target/release/bundle/dmg/DropSquash.dmg
      - name: Upload unsigned DMG artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dropsquash-unsigned-dmg
          path: target/release/bundle/dmg/DropSquash.dmg
      - name: Write unsigned DMG checksum
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- checksum target/release/bundle/dmg/DropSquash.dmg --output SHA256SUMS
      - name: Upload unsigned DMG checksum
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dropsquash-unsigned-dmg-checksum
          path: SHA256SUMS
      - name: Prepare App Store Connect key file
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            install -m 600 /dev/null "$key_path"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi
      - name: Check macOS signing environment
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ vars.APPLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo run -p xtask -- macos-signing-check
      - name: Plan macOS signing commands
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- macos-signing-plan target/release/bundle/dmg/DropSquash.dmg "$RUNNER_TEMP/dropsquash-signed"
      - name: Plan macOS temporary keychain commands
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- macos-keychain-plan "$RUNNER_TEMP/dropsquash-signing"
      - name: Import macOS signing certificate
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/dropsquash-signing"
          cert="$work_dir/DropSquash-signing.p12"
          keychain="$work_dir/DropSquash-signing.keychain-db"
          mkdir -p "$work_dir"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
      - name: Prepare signed DMG target
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- signed-dmg-prepare target/release/bundle/dmg/DropSquash.dmg "$RUNNER_TEMP/dropsquash-signed"
      - name: Copy DMG to signing target
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- signed-dmg-copy target/release/bundle/dmg/DropSquash.dmg "$RUNNER_TEMP/dropsquash-signed"
      - name: Plan macOS codesign command
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- macos-codesign-plan "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg" "Developer ID Application: ..."
      - name: Sign macOS DMG
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ vars.APPLE_CODESIGN_IDENTITY }}
        run: codesign --force --options runtime --timestamp --sign "$APPLE_CODESIGN_IDENTITY" "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg"
      - name: Plan macOS codesign verification commands
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- macos-codesign-verify-plan "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg"
      - name: Verify macOS codesign
        if: matrix.os == 'macos-latest'
        run: |
          codesign --verify --deep --strict --verbose=4 "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg"
          codesign -dv --verbose=4 "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg"
      - name: Plan macOS notarization command
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- macos-notary-plan "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg" --api-key
      - name: Notarize macOS DMG
        if: matrix.os == 'macos-latest'
        run: xcrun notarytool submit "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg" --wait --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
      - name: Plan macOS stapler commands
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- macos-stapler-plan "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg"
      - name: Plan macOS Gatekeeper assessment
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- macos-spctl-plan "$RUNNER_TEMP/dropsquash-signed/DropSquash.dmg"
      - name: Plan macOS temporary keychain cleanup
        if: matrix.os == 'macos-latest'
        run: cargo run -p xtask -- macos-keychain-cleanup-plan "$RUNNER_TEMP/dropsquash-signing"
      - name: Cleanup macOS signing keychain
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/dropsquash-signing/DropSquash-signing.keychain-db"
          cert="$RUNNER_TEMP/dropsquash-signing/DropSquash-signing.p12"
          security delete-keychain "$keychain" || true
          rm -f "$cert" "$keychain"
      - name: Block unsigned Phase 0 release
        shell: bash
        run: |
          echo "Signed release packaging is not implemented."
          exit 1
