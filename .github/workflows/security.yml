name: security

on:
  pull_request:
  schedule:
    - cron: "0 17 * * 0"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - name: Advisory audit
        run: cargo audit
      - name: License and source policy
        run: cargo deny check
      - name: Reject external media process code
        run: cargo run -p xtask -- media-policy-check
      - name: Reject default telemetry code
        run: cargo run -p xtask -- privacy-policy-check
