name: desktop-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: apps/desktop/web/pnpm-lock.yaml
      - name: install
        run: pnpm --dir apps/desktop/web install --frozen-lockfile
      - name: test
        run: pnpm --dir apps/desktop/web test
      - name: build
        run: pnpm --dir apps/desktop/web build

  desktop-rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - run: cargo test -p dropsquash-desktop
