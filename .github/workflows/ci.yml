name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: file size
        if: runner.os == 'Linux'
        run: cargo run -p xtask -- file-size-check
      - name: website
        if: runner.os == 'Linux'
        run: cargo run -p xtask -- website-check
      - name: Secure Share evidence script syntax
        if: runner.os == 'Linux'
        run: sh -n scripts/collect-secure-share-phase6-evidence.sh
      - name: release readiness
        if: ${{ false }}
        run: cargo run -p xtask -- release-check
      - name: clippy macOS
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --exclude dropsquash-desktop --all-targets -- -D warnings
      - name: test macOS
        if: runner.os == 'macOS'
        run: cargo test --workspace --exclude dropsquash-desktop
      - name: clippy portable crates
        if: runner.os != 'macOS'
        run: >-
          cargo clippy
          -p dropsquash-core -p dropsquash-encoder -p dropsquash-fileguard
          -p dropsquash-history -p dropsquash-license -p dropsquash-media
          -p dropsquash-postprocess -p dropsquash-profiles -p dropsquash-queue
          --all-targets -- -D warnings
      - name: test portable crates
        if: runner.os != 'macOS'
        run: >-
          cargo test
          -p dropsquash-core -p dropsquash-encoder -p dropsquash-fileguard
          -p dropsquash-history -p dropsquash-license -p dropsquash-media
          -p dropsquash-postprocess -p dropsquash-profiles -p dropsquash-queue

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate all development shells
        run: nix flake check --no-build --all-systems
